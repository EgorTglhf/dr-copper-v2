name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.2.1
      - name: Install dependencies
        run: poetry install
      - name: Validate project and lock file
        run: poetry check --lock
      - name: Run repository hooks
        run: poetry run pre-commit run --all-files
      - name: Build package
        run: poetry build
