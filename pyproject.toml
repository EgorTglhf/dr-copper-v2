[project]
name = "dr-copper-v2"
version = "0.1.0"
description = ""
authors = [
    {name = "EgorTglhf",email = "friggi40@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "yfinance (>=1.7.0,<2.0.0)",
    "fredapi (>=0.5.2,<0.6.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "arch (>=8.0.0,<9.0.0)",
]

[tool.poetry]
packages = [{include = "dr_copper_v2", from = "src"}]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "ipykernel (>=7.4.0,<8.0.0)",
    "nbformat (>=5.11.1,<6.0.0)",
    "kaleido (>=1.5.0,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
